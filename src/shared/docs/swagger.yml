openapi: 3.0.0
info:
  version: '1.1.0'
  title: Software Finance API
  termsOfService: 'http://swagger.io/terms/'
  license:
    name: ISC
  contact:
    name: Jesus Oviedo
    email: oviedossj3@gmail.com
servers:
  - url: https://api.example.com/v1
    description: Default server
paths:
  # Authentication endpoints
  /api/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/login:
    post:
      tags:
        - Authentication
      summary: Login with email and password
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/loginOauth:
    get:
      tags:
        - Authentication
      summary: Initiate Google OAuth login
      operationId: loginWithGoogle
      responses:
        '302':
          description: Redirect to Google OAuth
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/gtoken:
    get:
      tags:
        - Authentication
      summary: Handle Google OAuth callback
      operationId: handleGoogleCallback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/refresh:
    get:
      tags:
        - Authentication
      summary: Refresh access token
      operationId: refreshToken
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: string
                example: 'Token de acceso actualizado'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Categories endpoints
  /api/finance/categories:
    get:
      tags:
        - Categories
      summary: Get all categories by user
      operationId: getAllCategoriesByUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Categories
      summary: Create a new category
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  rto:
                    type: string
                    description: Category ID
                    example: "1"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/finance/categories/{id}:
    get:
      tags:
        - Categories
      summary: Get category by ID
      operationId: getCategoryById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Category ID
      responses:
        '200':
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Category not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Categories
      summary: Update category by ID
      operationId: updateCategoryById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Category ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Category not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Categories
      summary: Delete category by ID
      operationId: deleteCategoryById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Category ID
      responses:
        '200':
          description: Category deleted successfully
        '404':
          description: Category not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Subcategories endpoints
  /api/finance/sub_categories:
    post:
      tags:
        - Subcategories
      summary: Create a new subcategory
      operationId: createSubcategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubCategoryRequest'
      responses:
        '200':
          description: Subcategory created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  rto:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/finance/sub_categories/{id}:
    get:
      tags:
        - Subcategories
      summary: Get subcategories by category ID
      operationId: getSubcategoriesByCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Category ID
      responses:
        '200':
          description: Subcategories retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubCategory'
        '404':
          description: Category not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Subcategories
      summary: Update subcategory by ID
      operationId: updateSubcategoryById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Subcategory ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubCategoryUpdateRequest'
      responses:
        '200':
          description: Subcategory updated successfully
          content:
            application/json:
              schema:
                type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Subcategory not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Subcategories
      summary: Delete subcategory by ID
      operationId: deleteSubcategoryById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Subcategory ID
      responses:
        '200':
          description: Subcategory deleted successfully
        '404':
          description: Subcategory not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Transactions endpoints
  /api/finance/transactions:
    get:
      tags:
        - Transactions
      summary: Get all transactions by user
      operationId: getAllTransactionsByUser
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of transactions per page
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: Filter transactions from this date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: Filter transactions until this date
        - name: category_id
          in: query
          schema:
            type: integer
          description: Filter by category ID
        - name: type
          in: query
          schema:
            type: string
            enum: [income, expense]
          description: Filter by transaction type
      responses:
        '200':
          description: Transactions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Transactions
      summary: Create a new transaction
      operationId: createTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '200':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  rto:
                    type: string
                    description: Transaction ID
                    example: "1"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/finance/transactions/{id}:
    get:
      tags:
        - Transactions
      summary: Get transaction by ID
      operationId: getTransactionById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Transaction ID
      responses:
        '200':
          description: Transaction retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Transaction not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Transactions
      summary: Update transaction by ID
      operationId: updateTransactionById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Transaction ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdateRequest'
      responses:
        '200':
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Transaction not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Transactions
      summary: Delete transaction by ID
      operationId: deleteTransactionById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Transaction ID
      responses:
        '200':
          description: Transaction deleted successfully
        '404':
          description: Transaction not found
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Success:
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardResponse'
    Unauthorized:
      description: Access token is missing or is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    StandardResponse:
      type: object
      properties:
        message:
          type: string
          example: Successful operation
        status:
          type: number
          example: 200
    Error:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
        status:
          type: number
          example: 400
    ErrorItem:
      type: object
      properties:
        key:
          type: string
          example: general.UNAUTHORIZED.not_found_user
        message:
          type: string
          example: Invalid user or password not found
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - user_name
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
        user_name:
          type: string
          example: John Doe
        google_id:
          type: string
          example: 1234567890
        profile_picture:
          type: string
          example: http://example.com/avatar.jpg
        birthday:
          type: string
          format: date
          example: 1990-01-01
        phone:
          type: string
          example: 123-456-7890
        address:
          type: string
          example: 123 Main St, Anytown, USA
        auth_provider:
          type: string
          enum: [local, google]
          example: local
        reset_token:
          type: string
          example: abcdef123456
        reset_token_expiration:
          type: string
          format: date-time
          example: 2024-12-31T23:59:59Z
        email_verified:
          type: boolean
          example: false
        email_verification_token:
          type: string
          example: abcdef123456
    RegisterResponse:
      type: object
      properties:
        id:
          type: string
          example: "1"
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Food & Dining"
        description:
          type: string
          example: "Expenses related to food and restaurants"
        color:
          type: string
          example: "#FF5733"
        icon:
          type: string
          example: "food-icon"
        user_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
    CategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Food & Dining"
        description:
          type: string
          example: "Expenses related to food and restaurants"
        color:
          type: string
          example: "#FF5733"
        icon:
          type: string
          example: "food-icon"
    CategoryUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: "Food & Dining"
        description:
          type: string
          example: "Expenses related to food and restaurants"
        color:
          type: string
          example: "#FF5733"
        icon:
          type: string
          example: "food-icon"
    SubCategory:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Restaurants"
        description:
          type: string
          example: "Dining out at restaurants"
        category_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
    SubCategoryRequest:
      type: object
      required:
        - name
        - category_id
      properties:
        name:
          type: string
          example: "Restaurants"
        description:
          type: string
          example: "Dining out at restaurants"
        category_id:
          type: integer
          example: 1
    SubCategoryUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: "Restaurants"
        description:
          type: string
          example: "Dining out at restaurants"
    Transaction:
      type: object
      properties:
        id:
          type: integer
          example: 1
        amount:
          type: number
          example: 25.50
        description:
          type: string
          example: "Lunch at restaurant"
        type:
          type: string
          enum: [income, expense]
          example: "expense"
        category_id:
          type: integer
          example: 1
        subcategory_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        date:
          type: string
          format: date
          example: "2024-01-01"
        notes:
          type: string
          example: "Business lunch meeting"
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
    TransactionRequest:
      type: object
      required:
        - amount
        - description
        - type
        - category_id
      properties:
        amount:
          type: number
          example: 25.50
        description:
          type: string
          example: "Lunch at restaurant"
        type:
          type: string
          enum: [income, expense]
          example: "expense"
        category_id:
          type: integer
          example: 1
        subcategory_id:
          type: integer
          example: 1
        date:
          type: string
          format: date
          example: "2024-01-01"
        notes:
          type: string
          example: "Business lunch meeting"
    TransactionUpdateRequest:
      type: object
      properties:
        amount:
          type: number
          example: 25.50
        description:
          type: string
          example: "Lunch at restaurant"
        type:
          type: string
          enum: [income, expense]
          example: "expense"
        category_id:
          type: integer
          example: 1
        subcategory_id:
          type: integer
          example: 1
        date:
          type: string
          format: date
          example: "2024-01-01"
        notes:
          type: string
          example: "Business lunch meeting"